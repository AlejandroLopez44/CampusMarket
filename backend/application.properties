# ============================================================
# CampusMarket - Configuración del backend (Spring Boot)
# Ajusta usuario/clave con los de tu conexión de DBeaver.
# Se pueden sobreescribir con variables de entorno (DB_URL, DB_USER, DB_PASSWORD).
# ============================================================
server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/campusmarket}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# El esquema lo crea el script model/campusmarket_ddl.sql (fuente única de verdad).
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Caracas

# Sesión HTTP (cookie JSESSIONID) de 2 horas
server.servlet.session.timeout=2h

# Correo: si spring.mail.host está vacío, EmailNotificationController
# solo registra el correo en el log (modo desarrollo, sin SMTP).
